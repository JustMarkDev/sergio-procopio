# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: JustMarkDev/sergioprocopio
  branch: main

site_url: https://sergioprocopio.it
display_url: https://sergioprocopio.it
app_title: Sergio Procopio CMS
logo:
  src: /favicon.svg
  show_in_header: true
locale: it

media_folder: public/uploads
public_folder: /uploads
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: pagine
    label: Pagine
    icon: article
    files:
      - name: biografia
        label: Biografia
        file: src/content/pages/biografia.md
        media_folder: /src/content/pages/biografia/immagini
        public_folder: biografia/immagini
        fields:
          - { name: title, label: Titolo, widget: string }
          - { name: description, label: Descrizione SEO, widget: text }
          - { name: quote, label: Citazione, widget: text, required: false }
          - { name: image, label: Immagine principale, widget: image, required: false }
          - { name: body, label: Testo biografia, widget: richtext }

  - name: spettacoli
    label: Spettacoli
    label_singular: Spettacolo
    icon: theater_comedy
    folder: src/content/spettacoli
    path: "{{slug}}/index"
    media_folder: immagini
    public_folder: immagini
    create: true
    delete: true
    summary: "{{title}}"
    fields:
      - { name: title, label: Titolo, widget: string }
      - { name: description, label: Descrizione breve, widget: text }
      - { name: category, label: Categoria, widget: string, required: false }
      - name: image
        label: Immagine principale
        widget: image
        required: false
        hint: Apri uno spettacolo e carica l'immagine da questo campo. Il file verra salvato in src/content/spettacoli/[slug]/immagini/.
      - name: galleryImages
        label: Immagini galleria
        widget: image
        multiple: true
        required: false
        hint: Carica qui le immagini mentre stai modificando lo spettacolo. La libreria Asset generale non permette di scegliere manualmente la cartella dello spettacolo.
      - { name: durata, label: Durata, widget: string, required: false }
      - { name: regia, label: Regia, widget: string, required: false }
      - { name: eta, label: Eta consigliata, widget: string, required: false }
      - { name: produzione, label: Produzione, widget: string, required: false }
      - { name: cast, label: Cast, widget: string, required: false }
      - { name: tecnico, label: Cast tecnico, widget: string, required: false }
      - { name: requisiti, label: Requisiti, widget: text, required: false }
      - { name: highlight, label: In evidenza in homepage, widget: boolean, default: false, required: false }
      - { name: draft, label: Bozza, widget: boolean, default: true, required: false }
      - { name: body, label: Proposta, trama e contenuto pagina, widget: richtext }

  - name: eventi
    label: Eventi
    label_singular: Evento
    icon: event
    folder: src/content/eventi
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    create: true
    delete: true
    summary: "{{date}} - {{title}}"
    fields:
      - { name: title, label: Titolo, widget: string }
      - name: spettacolo
        label: Spettacolo collegato
        widget: relation
        collection: spettacoli
        value_field: title
        display_fields: [title, category]
        search_fields: [title, category]
        required: false
      - { name: date, label: Data, widget: datetime, type: date }
      - { name: time, label: Orario, widget: string, required: false }
      - { name: venue, label: Luogo, widget: string }
      - { name: city, label: Citta, widget: string }
      - { name: address, label: Indirizzo, widget: string, required: false }
      - { name: googleMapsUrl, label: Link Google Maps, widget: string, required: false }
      - { name: ticketUrl, label: Link biglietti, widget: string, required: false }
      - { name: description, label: Descrizione, widget: text, required: false }
      - { name: isPublic, label: Pubblico, widget: boolean, default: true, required: false }
      - { name: draft, label: Bozza, widget: boolean, default: true, required: false }
      - { name: body, label: Note interne o testo aggiuntivo, widget: richtext, required: false }
