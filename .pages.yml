settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "cms: aggiungi {path}"
      update: "cms: aggiorna {path}"
      delete: "cms: elimina {path}"
      rename: "cms: rinomina {oldPath} in {newPath}"

media:
  - name: assets
    label: Assets
    input: src/assets
    output: ../../assets
    categories: [image]
    rename: false

content:
  - name: spettacoli
    label: Spettacoli
    type: collection
    path: src/content/spettacoli
    format: yaml-frontmatter
    subfolders: false
    filename: "{title}.md"
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, category, durata, eta, highlight, draft]
      primary: title
      sort: [title]
      search: [title, description, category]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
        options:
          maxlength: 120

      - name: description
        label: Descrizione breve
        type: text
        required: true
        description: "Testo mostrato nella scheda e in apertura pagina"
        options:
          maxlength: 300

      - name: category
        label: Categoria
        type: string
        required: true
        description: "Esempio: Scuole, alpini, teatro"
        options:
          maxlength: 80

      - name: image
        label: Immagine principale
        type: image
        required: true
        description: "Scegli un'immagine in spettacoli/nome-spettacolo"
        options:
          media: assets
          path: spettacoli

      - name: galleryImages
        label: Galleria immagini
        type: image
        list: true
        description: "Immagini mostrate nella galleria dello spettacolo"
        options:
          media: assets
          path: spettacoli
          unique: true

      - name: durata
        label: Durata
        type: string
        required: true
        description: "Esempio: 1h 15m"
        options:
          maxlength: 40

      - name: regia
        label: Regia
        type: string
        required: true
        options:
          maxlength: 120

      - name: eta
        label: Eta consigliata
        type: string
        required: true
        description: "Esempio: 7+"
        options:
          maxlength: 40

      - name: tecnico
        label: Tecnico
        type: string
        required: true
        options:
          maxlength: 120

      - name: requisiti
        label: Requisiti
        type: string
        required: true
        options:
          maxlength: 180

      - name: highlight
        label: In evidenza
        type: boolean
        default: false
        description: "Mostra lo spettacolo tra quelli in evidenza, se previsto dal sito"

      - name: draft
        label: Bozza
        type: boolean
        default: false
        description: "Attiva per salvare senza pubblicare la pagina dello spettacolo"

      - name: body
        label: Contenuto pagina
        type: rich-text
        required: true
        description: "Testo principale della pagina. Usa titoli come Proposta e Trama"

  - name: eventi
    label: Eventi
    type: collection
    path: src/content/eventi
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{date}-{spettacolo}-al-{venue}.md"
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [date, spettacolo, venue, city, isPublic, draft]
      primary: venue
      sort: [date, spettacolo, city]
      search: [spettacolo, venue, city]
      default:
        sort: date
        order: desc
    fields:
      - name: spettacolo
        label: Spettacolo
        type: reference
        required: true
        options:
          collection: spettacoli
          value: "{title}"
          label: "{title}"

      - name: date
        label: Data e ora
        type: date
        required: true
        options:
          time: true
          format: dd-MM-yyyy HH:mm

      - name: venue
        label: Teatro o luogo
        type: string
        required: true
        description: "Inizia con la lettera maiuscola. Esempio: Teatro Sociale"
        pattern:
          regex: "^[A-ZÀ-ÖØ-Þ]"
          message: "Inizia il teatro o luogo con una lettera maiuscola"
        options:
          maxlength: 160

      - name: city
        label: Città
        type: string
        required: true
        description: "Inizia con la lettera maiuscola. Esempio: Milano"
        pattern:
          regex: "^[A-ZÀ-ÖØ-Þ]"
          message: "Inizia la città con una lettera maiuscola"
        options:
          maxlength: 100

      - name: address
        label: Indirizzo
        type: string
        required: true
        description: "Usa la maiuscola e separa il civico con una virgola. Esempio: Via Roma, 1"
        pattern:
          regex: "^[A-ZÀ-ÖØ-Þ]"
          message: "Inizia l'indirizzo con una lettera maiuscola"
        options:
          maxlength: 180

      - name: isPublic
        label: Pubblico sul sito
        type: boolean
        default: true
        description: "Disattiva se l'evento non deve comparire nel calendario"

      - name: draft
        label: Bozza
        type: boolean
        default: false
        description: "Attiva per salvare senza pubblicare sul calendario"

  - name: corso
    label: Corso di teatro
    type: file
    path: src/content/corso/corso-di-teatro.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
        options:
          maxlength: 120

      - name: description
        label: Descrizione breve
        type: text
        required: true
        description: "Testo mostrato in apertura pagina e nei motori di ricerca"
        options:
          maxlength: 300

      - name: image
        label: Immagine principale
        type: image
        description: "Scegli un'immagine dalla cartella corso"
        options:
          media: assets
          path: corso

      - name: docente
        label: Docente
        type: string
        default: "Sergio Procopio"
        options:
          maxlength: 120

      - name: destinatari
        label: Per chi
        type: string
        description: "Esempio: Scuole, oratori, associazioni, gruppi di adulti"
        options:
          maxlength: 160

      - name: eta
        label: Età
        type: string
        description: "Esempio: Dai 6 anni in su"
        options:
          maxlength: 60

      - name: durata
        label: Durata
        type: string
        description: "Esempio: Da un incontro a un percorso annuale"
        options:
          maxlength: 120

      - name: sede
        label: Dove
        type: string
        description: "Esempio: Presso la vostra struttura"
        options:
          maxlength: 120

      - name: costo
        label: Costo
        type: string
        description: "Esempio: Su preventivo"
        options:
          maxlength: 80

      - name: body
        label: Contenuto pagina
        type: rich-text
        required: true
        description: "Testo principale della pagina del corso"

  - name: date-corso
    label: Date del corso
    type: collection
    path: src/content/date-corso
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{date}-corso-di-teatro-al-{venue}.md"
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [date, venue, city, isPublic, draft]
      primary: venue
      sort: [date, city]
      search: [venue, city]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: Data e ora
        type: date
        required: true
        options:
          time: true
          format: dd-MM-yyyy HH:mm

      - name: venue
        label: Teatro o luogo
        type: string
        required: true
        description: "Inizia con la lettera maiuscola. Esempio: Teatro Sociale"
        pattern:
          regex: "^[A-ZÀ-ÖØ-Þ]"
          message: "Inizia il teatro o luogo con una lettera maiuscola"
        options:
          maxlength: 160

      - name: city
        label: Città
        type: string
        required: true
        description: "Inizia con la lettera maiuscola. Esempio: Milano"
        pattern:
          regex: "^[A-ZÀ-ÖØ-Þ]"
          message: "Inizia la città con una lettera maiuscola"
        options:
          maxlength: 100

      - name: address
        label: Indirizzo
        type: string
        required: true
        description: "Usa la maiuscola e separa il civico con una virgola. Esempio: Via Roma, 1"
        pattern:
          regex: "^[A-ZÀ-ÖØ-Þ]"
          message: "Inizia l'indirizzo con una lettera maiuscola"
        options:
          maxlength: 180

      - name: isPublic
        label: Pubblico sul sito
        type: boolean
        default: true
        description: "Disattiva se la data non deve comparire nel calendario"

      - name: draft
        label: Bozza
        type: boolean
        default: false
        description: "Attiva per salvare senza pubblicare sul calendario"

  - name: biografia
    label: Biografia
    type: file
    path: src/content/pages/biografia.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
        options:
          maxlength: 120

      - name: description
        label: Descrizione SEO
        type: text
        required: true
        description: "Testo usato come descrizione della pagina"
        options:
          maxlength: 300

      - name: quote
        label: Citazione
        type: text
        description: "Frase in evidenza nella pagina biografia"
        options:
          maxlength: 240

      - name: image
        label: Immagine biografia
        type: image
        description: "Scegli un'immagine dalla cartella biografia"
        options:
          media: assets
          path: biografia

      - name: since
        label: Anno di inizio carriera
        type: number
        description: "Gli anni sul palco si aggiornano da soli a partire da questo anno"

      - name: stats
        label: Numeri in evidenza
        type: object
        list: true
        fields:
          - name: value
            label: Numero
            type: string
            required: true
            description: "Esempio: 2000+"
          - name: label
            label: Descrizione
            type: string
            required: true

      - name: body
        label: Contenuto pagina
        type: rich-text
        required: true
        description: "Testo principale della biografia. L'elenco puntato sotto «Le tappe» diventa la cronologia: inizia ogni voce con l'anno in grassetto."
