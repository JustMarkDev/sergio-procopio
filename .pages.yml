settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "cms: aggiungi {path}"
      update: "cms: aggiorna {path}"
      delete: "cms: elimina {path}"
      rename: "cms: rinomina {oldPath} in {newPath}"

media:
  - name: assets
    label: Assets
    input: src/assets
    output: ../../assets
    categories: [image]
    rename: false

content:
  - name: spettacoli
    label: Spettacoli
    type: collection
    path: src/content/spettacoli
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{slug}.md"
      field: create
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, category, durata, eta, highlight, draft]
      primary: title
      sort: [title]
      search: [title, description, category]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
        options:
          maxlength: 120

      - name: slug
        label: Slug URL
        type: string
        required: true
        description: "Solo per nuovi spettacoli. Esempio: la-grande-guerra"
        options:
          maxlength: 120
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "Usa solo lettere minuscole, numeri e trattini"

      - name: description
        label: Descrizione breve
        type: text
        required: true
        description: "Testo mostrato nella scheda e in apertura pagina"
        options:
          maxlength: 300

      - name: category
        label: Categoria
        type: string
        required: true
        description: "Esempio: Scuole, alpini, teatro"
        options:
          maxlength: 80

      - name: image
        label: Immagine principale
        type: image
        description: "Scegli un'immagine in spettacoli/nome-spettacolo"
        options:
          media: assets
          path: spettacoli

      - name: galleryImages
        label: Galleria immagini
        type: image
        list: true
        description: "Immagini mostrate nella galleria dello spettacolo"
        options:
          media: assets
          path: spettacoli
          unique: true

      - name: durata
        label: Durata
        type: string
        description: "Esempio: 1h 15m"
        options:
          maxlength: 40

      - name: regia
        label: Regia
        type: string
        options:
          maxlength: 120

      - name: eta
        label: Eta consigliata
        type: string
        description: "Esempio: 7+"
        options:
          maxlength: 40

      - name: produzione
        label: Produzione
        type: string
        options:
          maxlength: 120

      - name: tecnico
        label: Tecnico
        type: string
        options:
          maxlength: 120

      - name: requisiti
        label: Requisiti
        type: string
        options:
          maxlength: 180

      - name: highlight
        label: In evidenza
        type: boolean
        default: false
        description: "Mostra lo spettacolo tra quelli in evidenza, se previsto dal sito"

      - name: draft
        label: Bozza
        type: boolean
        default: false
        description: "Attiva per salvare senza pubblicare la pagina dello spettacolo"

      - name: body
        label: Contenuto pagina
        type: rich-text
        required: true
        description: "Testo principale della pagina. Usa titoli come Proposta e Trama"

  - name: eventi
    label: Eventi
    type: collection
    path: src/content/eventi
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{date}-{title}-{city}.md"
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields: [date, time, title, venue, city, isPublic, draft]
      primary: title
      sort: [date, title, city]
      search: [title, spettacolo, venue, city]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titolo evento
        type: string
        required: true
        description: "Esempio: Pino 4.0 al Teatro Sociale"
        options:
          maxlength: 120

      - name: spettacolo
        label: Spettacolo
        type: string
        description: "Opzionale. Esempio: Pino 4.0"
        options:
          maxlength: 120

      - name: date
        label: Data
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: time
        label: Ora
        type: string
        description: "Opzionale. Usa il formato 21:00"
        pattern:
          regex: "^$|^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          message: "Usa il formato 21:00"
        options:
          maxlength: 5

      - name: venue
        label: Teatro o luogo
        type: string
        required: true
        description: "Esempio: Teatro Sociale"
        options:
          maxlength: 160

      - name: city
        label: Citta
        type: string
        required: true
        description: "Esempio: Milano"
        options:
          maxlength: 100

      - name: address
        label: Indirizzo
        type: string
        description: "Opzionale. Esempio: Via Roma 1"
        options:
          maxlength: 180

      - name: googleMapsUrl
        label: Link Google Maps
        type: string
        description: "Opzionale. Incolla qui il link di Google Maps"

      - name: description
        label: Descrizione breve
        type: text
        description: "Opzionale. Testo breve mostrato nella scheda evento"
        options:
          maxlength: 280

      - name: isPublic
        label: Pubblico sul sito
        type: boolean
        default: true
        description: "Disattiva se l'evento non deve comparire nel calendario"

      - name: draft
        label: Bozza
        type: boolean
        default: false
        description: "Attiva per salvare senza pubblicare sul calendario"
